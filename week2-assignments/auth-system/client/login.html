<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .card { background: #1a1a1a; padding: 2rem; border-radius: 8px; width: 100%; max-width: 400px; border: 1px solid #2a2a2a; }
    h2 { margin-bottom: 1.5rem; color: #f5a623; }
    input { width: 100%; padding: 0.75rem 1rem; margin-bottom: 1rem; background: #0f0f0f; border: 1px solid #333; border-radius: 4px; color: #fff; font-size: 0.95rem; }
    input:focus { outline: none; border-color: #f5a623; }
    button { width: 100%; padding: 0.75rem; background: #f5a623; color: #000; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    button:hover { background: #e09515; }
    .msg { margin-top: 1rem; text-align: center; font-size: 0.9rem; }
    .error { color: #ff4d4d; }
    .success { color: #4dff88; }
    p { margin-top: 1rem; text-align: center; font-size: 0.9rem; color: #888; }
    a { color: #f5a623; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Welcome Back</h2>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="login()">Login</button>
    <div class="msg" id="msg"></div>
    <p>Don't have an account? <a href="register.html">Register</a></p>
  </div>

  <script>
    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const msg = document.getElementById('msg');

      if (!email || !password) {
        msg.className = 'msg error';
        msg.textContent = 'All fields are required.';
        return;
      }

      try {
        const res = await fetch('http://localhost:5000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('username', data.user.username);
          msg.className = 'msg success';
          msg.textContent = 'Login successful! Redirecting...';
          setTimeout(() => window.location.href = 'dashboard.html', 1500);
        } else {
          msg.className = 'msg error';
          msg.textContent = data.message;
        }
      } catch (err) {
        msg.className = 'msg error';
        msg.textContent = 'Could not connect to server.';
      }
    }
  </script>
</body>
</html>
