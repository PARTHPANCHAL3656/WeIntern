<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .card { background: #1a1a1a; padding: 2rem; border-radius: 8px; width: 100%; max-width: 400px; border: 1px solid #2a2a2a; text-align: center; }
    h2 { color: #f5a623; margin-bottom: 1rem; }
    p { color: #aaa; margin-bottom: 2rem; line-height: 1.6; }
    .badge { display: inline-block; background: #f5a623; color: #000; padding: 0.3rem 0.8rem; border-radius: 20px; font-weight: bold; margin-bottom: 1.5rem; }
    button { padding: 0.75rem 2rem; background: #ff4d4d; color: #fff; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    button:hover { background: #e03c3c; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Dashboard</h2>
    <div class="badge" id="username-badge">Loading...</div>
    <p>You have successfully logged in.<br/>This is a protected page — only accessible with a valid JWT token.</p>
    <button onclick="logout()">Logout</button>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const username = localStorage.getItem('username');

    // If no token, redirect to login immediately
    if (!token) {
      window.location.href = 'login.html';
    }

    // Verify token with backend
    fetch('http://localhost:5000/api/dashboard', {
      headers: { 'Authorization': `Bearer ${token}` }
    })
    .then(res => {
      if (!res.ok) {
        localStorage.clear();
        window.location.href = 'login.html';
      }
      return res.json();
    })
    .then(data => {
      document.getElementById('username-badge').textContent = `👋 ${username}`;
    })
    .catch(() => {
      window.location.href = 'login.html';
    });

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('username');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
